<!DOCTYPE html>

<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cybersecurity Learning Roadmap">
    <title>CyberPentest Roadmap</title>
    <link rel="icon" href="favicon.png">
    <!-- الجولة الجديدة: أبيض هو الافتراضي — الليلي اختياري من الزرار ومحفوظ على الجهاز (من غير فلاش أبيض) -->
    <script>
        (function(){ try { if (localStorage.getItem('cyberTheme_v1') === 'dark') document.documentElement.classList.add('dark'); } catch(e){} })();
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.485.0/dist/umd/lucide.min.js"></script>
    <!-- Google Fonts (+ Caveat للتوقيع) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Orbitron:wght@500;700;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Orbitron', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            cyan: '#00f3ff',
                            red: '#ff003c',
                            purple: '#bc13fe',
                            dark: '#050505',
                        }
                    },
                    animation: {
                        'scanline': 'scanline 6s linear infinite',
                    },
                    keyframes: {
                        scanline: {
                            '0%': { top: '-10%', opacity: '0' },
                            '50%': { opacity: '0.3', boxShadow: '0 0 20px rgba(0, 243, 255, 0.2)' },
                            '100%': { top: '110%', opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-slate-900 dark:bg-[#020202] dark:text-white min-h-screen selection:bg-cyan-500 selection:text-white relative overflow-x-hidden font-sans">
    <!-- الخلفية المتحركة (ممنوع اللمس) -->
    <canvas id="matrix-canvas"></canvas>
    <div class="scan-beam"></div>
    <div class="vignette"></div>
    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-40 bg-white/90 dark:bg-black/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-colors duration-300 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="goHome()">
                <div class="p-2 bg-cyan-500/10 rounded-lg group-hover:bg-cyan-500/20 transition-colors border border-cyan-500/20">
                    <i data-lucide="terminal" class="w-6 h-6 text-cyan-600 dark:text-cyan-400"></i>
                </div>
                <div>
                    <span class="font-mono font-bold text-xl tracking-tighter text-slate-900 dark:text-white block leading-none">CYBER<span class="text-cyan-600 dark:text-cyan-400">PENTEST</span></span>
                    <span class="text-[10px] uppercase tracking-[0.2em] text-slate-500 dark:text-gray-500 font-bold">Advanced Roadmap</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- زرار الوضع الليلي (الافتراضي أبيض) -->
                <button id="theme-toggle" onclick="toggleTheme()" title="التبديل بين الأبيض والليلي" class="w-9 h-9 flex items-center justify-center rounded-full border border-slate-300 dark:border-gray-700 text-slate-600 dark:text-gray-300 hover:border-cyan-500 hover:text-cyan-600 dark:hover:text-cyan-400 transition-all"></button>
            </div>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 pt-32">

        <!-- Dashboard View -->
        <div id="dashboard-view" class="hidden">
            <div class="text-center mb-10">
                <p class="text-[10px] font-mono font-bold uppercase tracking-[0.3em] text-cyan-600 dark:text-cyan-400 mb-3">Web Penetration Testing · Roadmap</p>
                <h1 class="text-4xl md:text-6xl font-black font-mono mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-900 via-cyan-700 to-indigo-600 dark:from-white dark:via-cyan-300 dark:to-indigo-400 uppercase">Your Path, Level by Level</h1>
                <p class="text-base md:text-lg text-slate-600 dark:text-gray-400 max-w-2xl mx-auto leading-relaxed">اتبع المستويات بالترتيب، علّم على اللي خلّصته — وتقدّمك محفوظ على جهازك وتقدر تحمّله ملف وتنقله لأي جهاز.</p>
            </div>
            <!-- داشبورد التقدم والمحتوى -->
            <div id="stats-panel"></div>
            <!-- الوورك فلو: مسار المستويات -->
            <div id="workflow-wrap"></div>
            <!-- شبكة الليفلز -->
            <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 w-full"></div>
            <!-- الموارد الإضافية -->
            <div id="resources-wrap"></div>
        </div>
        <!-- Detail View -->
        <div id="detail-view" class="hidden">
            <div class="flex items-center justify-between mb-8">
                <button onclick="goHome()" class="flex items-center gap-2 text-sm font-mono font-bold text-slate-500 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-all tracking-wide uppercase group">
                    <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> Back to Path
                </button>
                <button id="add-category-btn" class="hidden px-4 py-2 bg-slate-100 dark:bg-gray-800 border border-slate-300 dark:border-gray-700 hover:border-cyan-500 text-slate-700 dark:text-gray-200 rounded-lg text-xs font-bold uppercase transition-all flex items-center gap-2">
                    <i data-lucide="folder-plus" class="w-4 h-4"></i> Add Category
                </button>
            </div>
            <div id="section-container" class="relative"></div>
        </div>
    </main>
    <!-- Footer — الشريط السفلي فيه التوقيع -->
    <footer class="py-4 text-center text-xs font-mono text-slate-500 dark:text-gray-600 uppercase tracking-widest border-t border-gray-200 dark:border-gray-800">
        <div class="flex flex-wrap justify-center items-center gap-x-4 gap-y-1 px-4">
            <span class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> System: Online</span>
            <span class="hidden sm:inline">|</span>
            <span class="bp-signature" dir="ltr">Created by abdallah elmohammady</span>
        </div>
    </footer>
    <input type="file" id="progress-import-input" accept=".json,application/json" class="hidden" onchange="importProgress(this)">
    <div id="mini-toast" class="mini-toast"></div>
    <script src="js/viewer.js"></script>

</body>
</html>
